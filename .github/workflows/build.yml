name: Build Chime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the app
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Name the install file
        run: cp app/build/outputs/apk/release/app-release.apk Chime.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Chime
          path: Chime.apk

      - name: Publish a release to download on the phone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chime build ${{ github.run_number }}
          body: Open this page on your Pixel, tap Chime.apk, and install.
          files: Chime.apk
          make_latest: true
